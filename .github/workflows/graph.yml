name: Generate profile images

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and patch contribution graph
        run: |
          mkdir -p dist
          curl -sSf --retry 5 --retry-all-errors --retry-delay 5 \
            -o dist/github-readme-activity-graph.svg \
            "https://github-readme-activity-graph.vercel.app/graph?username=Gody19&theme=react-dark&hide_border=true&radius=16"
          python3 - <<'PY'
          import re
          p = 'dist/github-readme-activity-graph.svg'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'animation:\s*dash\s+5s\s+ease-in-out\s+forwards;',
                     'animation: dash 5s ease-in-out infinite;', s)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched animation: infinite')
          PY

      - name: Generate top languages card
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 - <<'PY'
          import json, os, html, urllib.request

          GH = "https://api.github.com"
          USER = "Gody19"
          TOKEN = os.environ.get("TOKEN", "")

          def gh(url):
              headers = {"User-Agent": "Mozilla/5.0", "Accept": "application/vnd.github+json"}
              if TOKEN:
                  headers["Authorization"] = "Bearer " + TOKEN
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          COLORS = {
              "PHP": "#4F5D95", "Blade": "#f7523f", "CSS": "#663399",
              "HTML": "#e34c26", "JavaScript": "#f1e05a", "Python": "#3572A5",
              "Jupyter Notebook": "#DA5B0B", "TypeScript": "#3178c6",
              "Shell": "#89e051", "C": "#555555", "C++": "#f34b7d",
              "Go": "#00ADD8", "Rust": "#dea584", "Java": "#b07219",
              "Ruby": "#701516", "SQL": "#e38c00", "Dart": "#00B4AB",
              "Kotlin": "#A97BFF", "Swift": "#F05138",
          }
          def color_of(name):
              return COLORS.get(name, "#808080")

          repos = gh(GH + "/users/" + USER + "/repos?per_page=100&sort=updated")
          counts = {}
          for r in repos:
              if r.get("fork") or r["name"].lower() == USER.lower():
                  continue
              langs = gh(GH + "/repos/" + USER + "/" + r["name"] + "/languages")
              for lang, n in langs.items():
                  counts[lang] = counts.get(lang, 0) + n

          total = sum(counts.values()) or 1
          top = sorted(counts.items(), key=lambda kv: -kv[1])[:8]
          top = [(n, c) for (n, c) in top if c / total * 100 >= 0.5]

          W, PAD, ROW, HEAD = 420, 22, 30, 40
          H = HEAD + len(top) * ROW + 16

          out = []
          out.append('<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="%d" viewBox="0 0 %d %d">' % (W, H, W, H))
          out.append('<rect x="0" y="0" width="%d" height="%d" rx="10" fill="#0a0a0a"/>' % (W, H))
          out.append('<rect x="0" y="0" width="%d" height="%d" rx="10" fill="none" stroke="#1f1f1f"/>' % (W, H))
          out.append('<text x="%d" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#00ff88">TOP LANGUAGES</text>' % (W // 2))
          y = HEAD
          for name, n in top:
              pct = n / total * 100
              color = color_of(name)
              cy = y + 9
              out.append('<circle cx="%d" cy="%d" r="5" fill="%s"/>' % (PAD + 5, cy, color))
              out.append('<text x="%d" y="%d" font-family="Segoe UI, sans-serif" font-size="13" fill="#e6edf3">%s</text>' % (PAD + 18, cy + 4, html.escape(name)))
              out.append('<text x="%d" y="%d" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="13" fill="#00ff88">%.1f%%</text>' % (W - PAD, cy + 4, pct))
              bw = W - 2 * PAD
              out.append('<rect x="%d" y="%d" width="%d" height="5" rx="2.5" fill="#1f1f1f"/>' % (PAD, cy + 10, bw))
              out.append('<rect x="%d" y="%d" width="%d" height="5" rx="2.5" fill="%s"/>' % (PAD, cy + 10, int(bw * pct / 100), color))
              y += ROW
          out.append('</svg>')

          open("dist/top-langs.svg", "w", encoding="utf-8").write("\n".join(out))
          print("top-langs:", dict(top))
          PY

      - name: Push images to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}